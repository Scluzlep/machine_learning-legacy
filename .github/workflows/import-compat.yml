name: Import original compat branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-compat.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: import-compat-to-legacy
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout legacy Pages repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout original compatibility branch, including binary assets
        uses: actions/checkout@v4
        with:
          repository: Scluzlep/machine_learning
          ref: compat/pyodide-legacy-course
          path: .source-compat
          persist-credentials: false
      - name: Import complete compat snapshot without changing Pages workflows
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.source-compat/' \
            --exclude='/.github/workflows/' \
            .source-compat/ ./
          python - <<'PY'
          from pathlib import Path
          import json
          for path in sorted(Path("tests").glob("*.cjs")):
              original = path.read_text(encoding="utf-8")
              changed = original.replace(
                  "/machine_learning/", "/machine_learning-legacy/"
              ).replace(
                  "path.join(root, 'machine_learning')",
                  "path.join(root, 'machine_learning-legacy')"
              )
              if changed != original:
                  path.write_text(changed, encoding="utf-8")
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace(
              "https://scluzlep.github.io/machine_learning/lab/",
              "https://scluzlep.github.io/machine_learning-legacy/lab/"
          )
          text = ("> 独立预览版：同步自原仓库的 "
                  "`compat/pyodide-legacy-course` 分支，原始 Notebook 不作修改。"
                  "交互式 Matplotlib 后端仍在兼容测试中。\n\n" + text)
          readme.write_text(text, encoding="utf-8")
          notebook_count = len(list(Path("machine_learning").rglob("*.ipynb")))
          assert notebook_count == 44, notebook_count
          assert Path("tools/ml_kernel/patch_legacy_worker.py").exists()
          print(f"Imported {notebook_count} untouched notebooks; adapted legacy Pages path.")
          PY
          rm -rf .source-compat
          git add -A
          if git diff --cached --quiet; then
            echo "No differences from the imported compat snapshot."
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Import compat Pyodide legacy environment and adapt Pages path'
            git push origin HEAD:main
          fi
      - name: Trigger standalone GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "Legacy Pages deployment workflow dispatched."
              exit 0
            fi
            echo "Pages workflow not indexed yet, retry $attempt."
            sleep 8
          done
          echo "::error::Could not dispatch Pages workflow; run pages.yml manually."
          exit 1
